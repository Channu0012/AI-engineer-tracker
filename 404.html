<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | AI Engineer 2026</title>
  <meta name="description" content="The page or lesson you were looking for could not be found. Return to the AI Engineer 2026 Curriculum.">
  <meta name="theme-color" content="#2563eb">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .error-page-container {
      min-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .error-code-badge {
      font-family: var(--font-mono);
      font-size: 5rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 1rem;
      letter-spacing: -0.05em;
    }
    .error-title {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }
    .error-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      max-width: 480px;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .error-actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body class="light-theme">

  <!-- Header with Clickable Logo -->
  <header class="lms-header">
    <div class="header-inner">
      <a href="index.html" class="brand-link" title="AI Engineer 2026 Home">
        <div class="brand-logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-main">AI Engineer <span class="brand-highlight">2026</span></span>
          <span class="brand-tag">4-Month Intensive Bootcamp</span>
        </div>
      </a>
    </div>
  </header>

  <!-- 404 Body -->
  <main class="error-page-container">
    <div class="error-code-badge">404</div>
    <h1 class="error-title">Lesson or Page Not Found</h1>
    <p class="error-desc">
      The topic or resource you're trying to reach doesn't exist or may have been updated in the 16-week master curriculum.
    </p>
    <div class="error-actions">
      <a href="index.html" class="btn btn-primary btn-lg">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span>Return to Course Curriculum</span>
      </a>
    </div>
  </main>

</body>
</html>
